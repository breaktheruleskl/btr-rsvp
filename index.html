  <title>BREAK THE RULES · RSVP</title>
  <style>
    :root {
      --bg-color: #022b07; 
      --text-color: #df7f80; 
      --cyan-color: #00f0ff; 
      --error-color: #ff4d4d; 
    }
    body {
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-weight: bold;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 10px 24px 40px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    
    .music-btn {
      display: none; 
      position: fixed; top: 20px; right: 20px; border: 1px solid var(--text-color); color: var(--text-color); background: var(--bg-color); padding: 6px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; z-index: 100; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease;
    }
    .music-btn.playing { background: var(--text-color); color: var(--bg-color); }

    .header-logo-area { 
      margin-bottom: 0px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
    }
    .top-logo { 
      width: 240px; 
      max-width: 85%;
      height: auto; 
      margin-top: -20px; 
      margin-bottom: -10px;
      filter: drop-shadow(0 0 15px rgba(223, 127, 128, 0.4)); 
    }
    
    /* Private Event 徽章/横幅 */
    .private-badge {
      width: 100%;
      text-align: center;
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--text-color);
      opacity: 0.8;
      margin-top: 5px;
      margin-bottom: 25px;
      border-top: 1px solid rgba(223, 127, 128, 0.3);
      border-bottom: 1px solid rgba(223, 127, 128, 0.3);
      padding: 8px 0;
      text-transform: uppercase;
      font-weight: normal;
    }

    .form-page { display: none; }
    .form-page.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .form-group { margin-bottom: 20px; position: relative; }
    label { display: block; font-size: 16px; margin-bottom: 8px; }
    
    .optional-mark { font-size: 10px; font-weight: normal; opacity: 0.7; vertical-align: super; margin-left: 2px; }
    
    .sub-label { font-size: 13px; opacity: 0.8; margin-bottom: 12px; font-weight: normal; line-height: 1.4; }

    #page1 .sub-label {
      font-weight: normal;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="tel"], input[type="date"], textarea {
      width: 100%; 
      box-sizing: border-box; 
      padding: 14px; 
      border: 2px solid var(--text-color); 
      border-radius: 12px; 
      background: transparent; 
      color: var(--text-color); 
      font-family: Arial, sans-serif; 
      font-size: 12px; 
      font-weight: normal; 
      font-style: italic; 
      outline: none; 
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }
    
    input[type="date"] {
      display: block;
      min-width: 100%;
      text-align: left;
    }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; color: var(--text-color); }
    
    .form-page input[type="text"], .form-page textarea {
      font-size: 10px;
      font-weight: normal;
    }

    textarea { resize: none; line-height: 1.4; padding: 12px 14px; }
    input::placeholder, textarea::placeholder { color: var(--text-color); opacity: 0.4; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(60%) sepia(30%) saturate(300%) hue-rotate(320deg) brightness(90%) contrast(90%); }

    @keyframes breathingGlow {
      0% { box-shadow: 0 0 10px rgba(223, 127, 128, 0.15); }
      50% { box-shadow: 0 0 30px rgba(223, 127, 128, 0.65); }
      100% { box-shadow: 0 0 10px rgba(223, 127, 128, 0.15); }
    }

    @keyframes neonPulseVisible {
      0% { 
        -webkit-box-shadow: 0 0 12px rgba(223, 127, 128, 0.25), inset 0 0 6px rgba(223, 127, 128, 0.1); 
        box-shadow: 0 0 12px rgba(223, 127, 128, 0.25), inset 0 0 6px rgba(223, 127, 128, 0.1); 
        border-color: rgba(223, 127, 128, 0.65);
      }
      50% { 
        -webkit-box-shadow: 0 0 24px rgba(223, 127, 128, 0.5), inset 0 0 12px rgba(223, 127, 128, 0.2); 
        box-shadow: 0 0 24px rgba(223, 127, 128, 0.5), inset 0 0 12px rgba(223, 127, 128, 0.2); 
        border-color: rgba(223, 127, 128, 0.95);
      }
      100% { 
        -webkit-box-shadow: 0 0 12px rgba(223, 127, 128, 0.25), inset 0 0 6px rgba(223, 127, 128, 0.1); 
        box-shadow: 0 0 12px rgba(223, 127, 128, 0.25), inset 0 0 6px rgba(223, 127, 128, 0.1); 
        border-color: rgba(223, 127, 128, 0.65);
      }
    }

    .date-options { display: flex; gap: 16px; }
    .date-card { 
      flex: 1; 
      padding: 8px 6px; 
      background: transparent; 
      border: 2px solid var(--text-color); 
      border-radius: 12px; 
      text-align: center; 
      cursor: pointer; 
      position: relative; 
      transition: all 0.2s ease; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 48px; 
    }
    .date-card.selected { background: rgba(223, 127, 128, 0.15); border-width: 3px; animation: breathingGlow 3s infinite ease-in-out; }
    
    .date-card.disabled { 
      opacity: 0.4; 
      cursor: not-allowed; 
      border-color: rgba(223, 127, 128, 0.3); 
      background: transparent;
    }
    .date-card.disabled:active {
      transform: none;
    }
    
    .date-main { font-size: 16px; font-weight: 900; line-height: 1.1; }
    .date-sub { font-size: 11px; margin-top: 2px; opacity: 0.85; font-weight: normal; }

    .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 20px; padding-bottom: 40px; }
    .btn-group-right { justify-content: flex-end; }
    
    button.next-btn { background: var(--text-color); color: var(--bg-color); border: none; padding: 14px 32px; border-radius: 30px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: opacity 0.2s; animation: breathingGlow 3.5s infinite ease-in-out; }
    button.next-btn:active { opacity: 0.8; }
    .back-link { color: var(--text-color); text-decoration: none; opacity: 0.8; font-weight: normal; }
    .error-msg { color: var(--error-color); font-size: 13px; margin-top: 8px; display: none; font-weight: normal; }
    .error-border { border-color: var(--error-color) !important; }

    /* ================= 缩小版：推荐人单选样式 ================= */
    .referral-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .referral-card {
      padding: 10px 14px;
      border: 1.5px solid rgba(223, 127, 128, 0.4);
      border-radius: 10px;
      font-size: 11px;
      font-weight: normal;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: var(--text-color);
      display: flex;
      align-items: center;
    }
    .referral-card:hover { border-color: rgba(223, 127, 128, 0.8); }
    .referral-card.selected {
      border-color: var(--text-color);
      background: rgba(223, 127, 128, 0.15);
      font-weight: bold;
    }
    .referral-card::before {
      content: '';
      display: inline-block;
      width: 12px; height: 12px;
      border: 1.5px solid var(--text-color);
      border-radius: 50%;
      margin-right: 10px;
      transition: all 0.2s ease;
    }
    .referral-card.selected::before {
      background: var(--text-color);
      box-shadow: inset 0 0 0 2.5px var(--bg-color); 
    }
